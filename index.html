<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hossam & Rodica Wedding</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080808;color:#d8bd7b;
 font-family:'Amiri',serif;text-align:center;
 min-height:100vh;padding:25px 14px;
 display:flex;justify-content:center;align-items:center;
}
.card{
 width:100%;max-width:430px;
 min-height:720px;padding:45px 23px;
 border:1px solid #b99a58;
 outline:1px solid #b99a58;
 outline-offset:-9px;
 display:flex;flex-direction:column;
 justify-content:center;align-items:center;
 background:linear-gradient(145deg,#111,#050505);
}
.small{font-size:17px;letter-spacing:3px}
.ornament{font-size:30px;margin:15px}
h1{
 font-family:'Cormorant Garamond',serif;
 font-size:43px;font-weight:500;
 direction:ltr;margin:12px 0;color:#e4c982;
}
h2{font-size:25px;font-weight:400;margin:10px}
.line{width:65%;height:1px;background:#aa8b4d;margin:20px}
p{font-size:20px;line-height:1.9;margin:8px}
.date{font-size:25px;margin:15px}
.place{font-size:19px;line-height:1.9}
.footer{font-size:16px;margin-top:25px;color:#bba574}
</style>
</head>
<body>
<div class="card">
 <div class="small">بسم الله المحبة والبركة</div>
 <div class="ornament">✧ ❦ ✧</div>
 <p>بكل الحب والفرح</p>
 <p>يسعدنا دعوتكم لمشاركتنا</p>
 <h2>صلاة الإكليل</h2>
 <div class="line"></div>
 <h1>Hossam & Rodica</h1>
 <div class="ornament">❦</div>
 <p>وذلك يوم الخميس</p>
 <div class="date">12 نوفمبر 2026</div>
 <p>في تمام الساعة</p>
 <h2>8:00 مساءً</h2>
 <div class="line"></div>
 <div class="place">
 مطرانية أم المحبة الإلهية<br>
 للأقباط الكاثوليك بأسيوط
 </div>
 <div class="ornament">✧</div>
 <p>حضوركم يزيد فرحتنا جمالاً</p>
 <div class="footer">With Love • Hossam & Rodica</div>
</div>
</body>
</html>
